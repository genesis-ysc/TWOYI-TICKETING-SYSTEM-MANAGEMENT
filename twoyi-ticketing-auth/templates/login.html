{% extends "base.html" %}
{% block title %}Log in · {{ app_title }}{% endblock %}
{% block content %}

<div class="login-wrap">
  <div class="card login-card">
    <h1>Log in</h1>
    <p class="page-sub">Sign in with your email address to log a ticket or view your tickets.</p>

    <form method="post" action="{{ url_for('login', next=request.args.get('next')) }}" class="form">
      <div class="field">
        <label for="login">Email or username</label>
        <input type="text" id="login" name="login" value="{{ login or '' }}"
               required autofocus autocapitalize="none" autocomplete="username">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn-primary">Log in</button>
    </form>

    {% if unverified_email %}
    <form method="post" action="{{ url_for('resend_verification') }}" class="resend-form">
      <input type="hidden" name="email" value="{{ unverified_email }}">
      <button type="submit" class="btn-ghost">Resend confirmation email</button>
    </form>
    {% endif %}

    <p class="auth-switch">New here? <a href="{{ url_for('register') }}">Register with your email</a></p>
  </div>
</div>

{% endblock %}
